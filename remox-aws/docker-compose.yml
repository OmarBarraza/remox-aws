version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: remox-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - OFICINA_ID=${OFICINA_ID:-449}
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: remox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/public:/var/www/remox/frontend/public:ro
    depends_on:
      - app
